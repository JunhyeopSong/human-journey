<style>
/* shared look: time-machine-ui v1 · below: this product only */
/* timeline marks for events: dots for single dates, bars for ranges; dashed = disputed claim; striped = disputed part */
.evrow button { z-index: 1; }
.evrow .lbar { position: absolute; height: 2px; border-radius: 1px; background: var(--k); opacity: .45; pointer-events: none; }
.evrow .lconn { position: absolute; width: 0; border-left: 1px dashed var(--k); opacity: .4; pointer-events: none; }
.evrow button.lname { width: auto; height: 11px; transform: none; font-size: 9.5px; line-height: 11px; color: var(--k); white-space: nowrap; padding: 0 3px; border-radius: 3px; background: rgba(14,16,22,.75); z-index: 2; }

.evrow button.lname:disabled { cursor: default; }

.bl-head { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0; font-size: 10.5px; letter-spacing: .1em;

.biolegend.closed .bl-body { display: none; }
.bl-body span { display: flex; align-items: center; gap: 7px; white-space: nowrap; min-width: 0; }
.bl-body i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.bl-body small { grid-column: 1 / -1; font-size: 10.5px; color: var(--ink-3); line-height: 1.4; }
.tvals { display: contents; }   /* wide screens: the two readouts sit in the row as before */

.chiprow { display: flex; align-items: center; gap: 8px; min-width: 0; }
.chiprow .pwrap { flex: 1; }
#treeBtn { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 3px 10px 3px 8px; margin-top: 2px; border-radius: 999px; color: var(--ink-2); background: var(--fill); white-space: nowrap; }
#treeBtn:hover { color: var(--ink); }
#treeBtn[aria-pressed="true"] { background: rgba(255,255,255,.2); color: var(--ink); }
.dock.folded .chiprow { display: none; }
.evrow button.contested { background: transparent; box-shadow: inset 0 0 0 1.2px var(--k); }
.evrow button.claim { background: repeating-linear-gradient(135deg, var(--k) 0 2px, transparent 2px 4px); opacity: .8; }
.evrow button.cur { box-shadow: 0 0 0 1.5px #fff; }
.pop .dsp { font-size: 11.5px; line-height: 1.5; color: #ffcf8a; }
.pop .dsp b { font-weight: 600; margin-right: 4px; }
.pop .src { margin: 0; padding: 0 0 0 14px; font-size: 11px; line-height: 1.5; color: var(--ink-3); }
.pop .src a { color: var(--ink-2); }
.pop .badge { font-size: 9.5px; padding: 1px 6px; border-radius: 999px; border: 0.5px solid #ffcf8a; color: #ffcf8a; margin-left: 6px; letter-spacing: 0; }
@media (max-width: 640px) {

      foot: '출처 · 해수면: Spratt & Lisiecki 2016 (Clim. Past, NOAA 공개 자료) 0–80만 년 전, 오늘을 0 m로 맞춤; 80만~330만 년 전은 LR04 해저 산소동위원소 기록(Lisiecki & Raymo 2005)으로 추정(덜 확실). 지형: ETOPO1 (NOAA, 0.25°로 줄임). 평균 기온: EPICA Dome C 남극 기온(Jouzel 외 2007, NOAA)을 마지막 빙기 최성기가 지금보다 6.1 °C 낮도록(Tierney 외 2020) 비율을 맞춰 지구 평균으로 바꾼 근사치; 80만 년 전보다 오래된 시기는 LR04로 추정. 빙상: 북반구는 Batchelor 외 2019 (Nature Communications, CC BY 4.0)의 12개 시기 최적 추정 복원을 0.25°로 바꿔 쓰고, 그 사이 시기는 가장 가까운 복원을 해수면에 맞춰 가장자리부터 줄이거나 늘림. 그린란드·남극의 현재 빙상은 지형에서, 파타고니아는 직접 그린 개략도. 종 분포: 연대가 측정된 유적만으로 그림 — Timmermann 외 2022 (Nature, 보충표 1, CC BY 4.0) 3만–200만 년 전, ROAD 데이터베이스 (ROCEEH, CC BY-SA 4.0) 3만 년 전 이후 현생인류, 그리고 출처를 붙인 유적 목록; 5만 년 전 이후 현생인류는 인정된 유적에서 육지를 따라 천 년에 약 500 km씩 퍼짐(바다는 건너지 않음). 땅의 오르내림(빙하 지각 평형): ICE-6G_C (VM5a) 고지형 — Peltier 외 2015 (J. Geophys. Res. Solid Earth, doi:10.1002/2014JB011176), Argus 외 2014 (Geophys. J. Int., doi:10.1093/gji/ggu140); 2만 6천 년 전부터 현재까지 1천 년 간격, 그 이전은 최종 빙기 최성기의 모습을 해수면에 맞춰 줄여 씀. 파나마 해로: 약 280만 년 전 이전의 개략도(O’Dea 외 2016, Sci. Adv.). 환경(바이옴): Beyer, Krapp & Manica 2020 (Sci. Data, doi:10.1038/s41597-020-0552-1, CC BY 4.0) BIOME4 0–12만 년 전; Krapp 외 2021 (Sci. Data, doi:10.1038/s41597-021-01009-3, CC BY 4.0) 12만–80만 년 전; 약 300만 년 전보다 오래된 때는 PRISM4 바이옴(Dowsett 외 2016, Clim. Past; Salzmann 외 2008, Glob. Ecol. Biogeogr.); 28종을 8개로 묶음; 80만~300만 년 전은 해수면이 가장 비슷한 시점으로 근사. 판 이동(최대 약 200 km)은 반영하지 않은 프로토타입입니다.' } },

function updateSpecies() {

$('rangesOn').onchange = e => { showRanges = e.target.checked; try { localStorage.setItem('hj.ranges', showRanges ? '1' : '0'); } catch (_) {} if (!showRanges && popSpecies !== null) closePop(); };

// ---------- place names (same look as the Continental Time Machine): continents, oceans, and the land bridges that

  { ko: '아프리카', en: 'Africa', "ja": "アフリカ", "zh-Hant": "非洲", "es": "África", lon: 20, lat: 5 }, { ko: '유라시아', en: 'Eurasia', "ja": "ユーラシア", "zh-Hant": "歐亞大陸", "es": "Eurasia", lon: 68, lat: 56 },
  { ko: '북아메리카', en: 'North America', "ja": "北アメリカ", "zh-Hant": "北美洲", "es": "América del Norte", lon: -100, lat: 45 }, { ko: '남아메리카', en: 'South America', "ja": "南アメリカ", "zh-Hant": "南美洲", "es": "América del Sur", lon: -60, lat: -12 },
  { ko: '오스트레일리아', en: 'Australia', "ja": "オーストラリア", "zh-Hant": "澳洲", "es": "Australia", lon: 134, lat: -25 }, { ko: '남극', en: 'Antarctica', "ja": "南極", "zh-Hant": "南極洲", "es": "Antártida", lon: 40, lat: -80 },

try { if (localStorage.getItem('hj.places') === '0') $('placesOn').checked = false; } catch (_) {}
$('grid').onchange = () => { if (relief) paint(seaAt(age)); };
function setMapStyle(v) {

$('placesOn').onchange = e => { try { localStorage.setItem('hj.places', e.target.checked ? '1' : '0'); } catch (_) {} };
function placePlaces() {

      o = Math.max(0, Math.min(1, elevAt(ri * RW + rx, seaAt(age)) / 15));

// ---------- spin axis (as in the Continental Time Machine): a rod through the poles with North/South tags; with it on,
// the view rolls by Earth's obliquity (23.4° today; it swings only about 22–24.5° over 41,000-year cycles) ----------
const axisGroup = new THREE.Group();
const axisMat = new THREE.MeshBasicMaterial({ color: 0xffd9a0, transparent: true, opacity: 0.85 });
const AX = 1.32;
axisGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.0045, 0.0045, AX * 2, 8), axisMat));
for (const sgn of [1, -1]) {
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.016, 0.05, 12), axisMat);
  tip.position.y = sgn * (AX + 0.02); if (sgn < 0) tip.rotation.x = Math.PI; axisGroup.add(tip);
  const cap = new THREE.Mesh(new THREE.RingGeometry(0.022, 0.03, 32), new THREE.MeshBasicMaterial({ color: 0xffd9a0, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
  cap.position.y = sgn * 1.003; cap.rotation.x = Math.PI / 2; axisGroup.add(cap);
}
axisGroup.visible = false; G.earth.add(axisGroup);
const OBLIQUITY = 23.44 * D2R;
let roll = 0;
function stepRoll(dt) {
  const target = axisGroup.visible && !mapMode ? OBLIQUITY : 0;
  if (Math.abs(target - roll) < 1e-4) roll = target; else roll += (target - roll) * Math.min(1, dt * 5);
  G.camera.up.set(-Math.sin(roll), Math.cos(roll), 0);
}
const poleEls = [[$('poleN'), 1, 'northPole'], [$('poleS'), -1, 'southPole']], poleV = new THREE.Vector3(), camDir = new THREE.Vector3();

// ---------- phone layout (same as the Continental Time Machine) ----------
(() => {

  let open = false; apply(open);

// ---------- loop ----------
let lastFrame = performance.now();
const MAX_KA_PER_S = 12;            // at "normal"; slow ×0.4, fast ×3
function loop(now) {
  const dt = Math.min(0.1, (now - lastFrame) / 1000); lastFrame = now;
  if (playing) {
    let a;
    if (scaleKind === 'linear') a = age - 2.5 * (AGE_MAX / 300) * speedVal * dt;   // the whole span in about 2 minutes
    else a = tl.scale.age(Math.min(1, tl.scale.pct(age) / 100 + speedVal * dt / 120));
    a = Math.max(a, age - MAX_KA_PER_S * speedVal * dt);   // never faster than people can follow (a 41-kyr ice-age cycle takes seconds)
    if (dt > 0) playRate = playRate ? playRate * 0.8 + (age - a) / dt * 0.2 : (age - a) / dt;
    if (a <= 0.001) { a = 0; stop(); }   // the log scale only approaches 0

// ---------- boot ----------
function loadRelief(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
      const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0);
      const d = x.getImageData(0, 0, im.width, im.height).data, out = new Float32Array(im.width * im.height);
      for (let i = 0; i < out.length; i++) out[i] = d[i * 4] * 256 + d[i * 4 + 1] - 12000;

  });
}
applyLang();
requestAnimationFrame(loop);
function loadGray(src) {

    const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0); const d = x.getImageData(0, 0, im.width, im.height).data, o = new Uint8Array(im.width * im.height);

}
Promise.all([loadRelief('data/relief.png'), fetch('data/sealevel.json').then(r => r.json()), fetch('data/events.json').then(r => r.json()),
  fetch('data/ice_nh.json').then(r => r.json()), loadGray('data/ice_nh.png'), fetch('data/sites.json').then(r => r.json()),
  fetch('data/species.json').then(r => r.json()), fetch('data/temperature.json').then(r => r.json()), loadGray('data/arrival.png'),
  loadGray('data/gia.png'), fetch('data/gia.json').then(r => r.json())]).then(([r, sea, ev, im, ia, st, spc, tp, arv, gia, giaMeta]) => {
