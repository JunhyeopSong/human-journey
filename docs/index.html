<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인류의 여정</title>
<meta name="description" content="200만 년 전부터 지금까지, 해수면과 함께 바뀌는 지구 위에서 인류가 세계로 퍼져 나간 길을 따라가는 3D 지구본 (프로토타입)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://junhyeopsong.github.io/time-machine-ui/v1/tokens.css">
<link rel="stylesheet" href="https://junhyeopsong.github.io/time-machine-ui/v1/base.css">
<style>
/* shared look: time-machine-ui v1 · below: this product only */
/* timeline marks for events: dots for single dates, bars for ranges; dashed = disputed claim; striped = disputed part */
.evrow button { z-index: 1; }
.evrow .lbar { position: absolute; height: 2px; border-radius: 1px; background: var(--k); opacity: .45; pointer-events: none; }
.evrow .lconn { position: absolute; width: 0; border-left: 1px dashed var(--k); opacity: .4; pointer-events: none; }
.evrow button.lname { width: auto; height: 11px; transform: none; font-size: 9.5px; line-height: 11px; color: var(--k); white-space: nowrap; padding: 0 3px; border-radius: 3px; background: rgba(14,16,22,.75); z-index: 2; }
.evrow button.lname:hover { transform: none; background: rgba(255,255,255,.14); }
.evrow button.lname:disabled { cursor: default; }
.evrow { transition: height .2s; }
.chiprow { display: flex; align-items: center; gap: 6px; margin-left: 8px; padding-top: 2px; min-width: 0; }   /* the tree toggle stays put; only the chips scroll */
.chiprow .pwrap { flex: 1 1 auto; margin-left: 0; }
.chiprow .presets { padding-top: 0; }
#treeBtn { flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
  color: var(--ink); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,.35); background: transparent; }
#treeBtn[aria-pressed="true"] { background: rgba(255,255,255,.14); }
#treeBtn svg { width: 13px; height: 13px; }
@media (max-width: 640px) { .dock.folded .chiprow { display: none; } }
.evrow button.contested { background: transparent; box-shadow: inset 0 0 0 1.2px var(--k); }
.evrow button.claim { background: repeating-linear-gradient(135deg, var(--k) 0 2px, transparent 2px 4px); opacity: .8; }
.evrow button.cur { box-shadow: 0 0 0 1.5px #fff; }
.pop .dsp { font-size: 11.5px; line-height: 1.5; color: #ffcf8a; }
.pop .dsp b { font-weight: 600; margin-right: 4px; }
.pop .src { margin: 0; padding: 0 0 0 14px; font-size: 11px; line-height: 1.5; color: var(--ink-3); }
.pop .src a { color: var(--ink-2); }
.pop .badge { font-size: 9.5px; padding: 1px 6px; border-radius: 999px; border: 0.5px solid #ffcf8a; color: #ffcf8a; margin-left: 6px; letter-spacing: 0; }
@media (max-width: 640px) {
  #seaChip { display: none; }
  .era { box-sizing: border-box; width: calc(100vw - 32px - 52px); grid-template-columns: minmax(0, 1fr); }      /* clear of the settings button */
  .era > * { min-width: 0; }
  #eraEyebrow { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }   /* one line */
}
.proto { white-space: nowrap; flex: none; font-size: 9.5px; padding: 1px 6px; border-radius: 999px; border: 0.5px solid var(--accent); color: var(--accent); letter-spacing: .02em; text-transform: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="loading" data-i18n="loading">지형 데이터를 불러오는 중…</div>
<div id="pins" data-i18n-aria="pins" aria-label="지도 위 사건"></div>
<div class="glass pop" id="pop" role="dialog" aria-live="polite" hidden>
  <button class="x" id="popX" data-i18n-aria="close" aria-label="닫기">×</button>
  <div class="pk" id="popKind"></div>
  <h2 id="popTitle"></h2>
  <div class="pa" id="popAge"></div>
  <p id="popText"></p>
  <div class="dsp" id="popDsp" hidden></div>
  <ol class="src" id="popSrc"></ol>
  <div class="acts"><button class="go" id="popGo" data-i18n="goHere">이 시점으로 이동</button></div>
</div>

<div class="hud">
  <div class="glass era" id="era" aria-live="polite">
    <span class="eyebrow"><span id="eraEyebrow">—</span><span class="proto" data-i18n="proto">프로토타입</span></span>
    <span class="period"><span class="chip" id="eraChip"></span><span id="eraName">—</span></span>
    <span class="txt" id="eraText"></span>
  </div>

  <button class="glass icon" id="gear" data-icon="sliders-horizontal" data-i18n-aria="settings" data-i18n-title="settings" aria-label="보기 설정" aria-expanded="false" aria-controls="sheet" title="보기 설정"></button>
  <section class="glass sheet" id="sheet" data-i18n-aria="settings" aria-label="보기 설정" hidden><div class="sheet-in" id="sheetIn">
    <div class="group">
      <label class="item" for="lang"><span data-i18n="lang">언어</span><select id="lang"></select></label>
    </div>
    <div class="group">
      <div class="item"><span data-i18n="view">보기</span>
        <div class="seg" id="viewSeg" role="radiogroup" data-i18n-aria="view" aria-label="보기">
          <button role="radio" data-v="globe" data-i18n="viewGlobe" aria-checked="true">지구본</button>
          <button role="radio" data-v="map" data-i18n="viewMap" aria-checked="false">전체 지도</button>
        </div>
      </div>
      <div class="item"><span data-i18n="scale">타임라인 눈금</span>
        <div class="seg" id="scaleSeg" role="radiogroup" data-i18n-aria="scale" aria-label="타임라인 눈금">
          <button role="radio" data-s="linear" aria-checked="false" data-i18n="linear">선형</button>
          <button role="radio" data-s="log" aria-checked="true" data-i18n="log">로그</button>
        </div>
      </div>
      <label class="item"><span data-i18n="contested">논쟁 중인 연대도 보기</span><span class="sw"><input type="checkbox" role="switch" id="contestedOn" checked><span class="tr"></span></span></label>
      <label class="item"><span data-i18n="ranges">종 분포</span><span class="sw"><input type="checkbox" role="switch" id="rangesOn" checked><span class="tr"></span></span></label>
      <label class="item"><span data-i18n="ice">빙상</span><span class="sw"><input type="checkbox" role="switch" id="iceOn" checked><span class="tr"></span></span></label>
      <label class="item"><span data-i18n="spin">자동 회전</span><span class="sw"><input type="checkbox" role="switch" id="spin" checked><span class="tr"></span></span></label>
      <label class="item"><span><span data-i18n="follow">재생 중 따라가기</span><small data-i18n="followSub">사건이 일어나는 곳으로 이동</small></span><span class="sw"><input type="checkbox" role="switch" id="follow" checked><span class="tr"></span></span></label>
    </div>
    <div class="group">
      <div class="item"><span data-i18n="temp">평균 기온</span>
        <div class="seg" id="unit" role="radiogroup" data-i18n-aria="unit" aria-label="온도 단위">
          <button role="radio" data-u="C" aria-checked="true">°C</button>
          <button role="radio" data-u="F" aria-checked="false">°F</button>
        </div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="foot" id="foot"></div>
    <div class="foot fb"><span data-i18n="feedback">피드백·오류 제보</span>: <a href="mailto:sapu0000@gmail.com">sapu0000@gmail.com</a><a class="gh" href="https://github.com/JunhyeopSong/human-journey/issues/new" target="_blank" rel="noopener" data-i18n-aria="feedbackGithub" data-i18n-title="feedbackGithub" aria-label="GitHub에 이슈 남기기" title="GitHub에 이슈 남기기"><svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a></div>
  </div></section>

  <nav class="glass nav" data-i18n-aria="globeCtl" aria-label="지구본 조작">
    <button id="zIn" data-icon="plus" data-i18n-aria="zoomIn" data-i18n-title="zoomIn" aria-label="확대" title="확대"></button>
    <button id="zOut" data-icon="minus" data-i18n-aria="zoomOut" data-i18n-title="zoomOut" aria-label="축소" title="축소"></button>
    <button id="home" data-icon="globe" data-i18n-aria="home" data-i18n-title="home" aria-label="지구 전체 보기" title="지구 전체 보기"></button>
  </nav>

  <div class="glass hint" id="hint"><span data-i18n="hint1">드래그로 돌리기 · 휠·핀치로 확대</span><span class="hide-sm" data-i18n="hint2"> · Space 재생/정지 · 1·2·3 속도</span></div>

  <section class="glass dock" data-i18n-aria="timeCtl" aria-label="시간 조절">
    <div class="row1">
      <div class="transport" role="group" data-i18n-aria="transport" aria-label="재생 조작">
        <button class="step" id="back" data-i18n-aria="back" data-i18n-title="back" aria-label="과거로" title="과거로 (←)"><svg viewBox="0 0 16 16"><path d="M12 2.8v10.4a.6.6 0 0 1-.9.5L3.4 8.5a.6.6 0 0 1 0-1l7.7-5.2a.6.6 0 0 1 .9.5z"/></svg></button>
        <button class="play" id="play" data-i18n-title="playTitle" aria-label="재생" title="재생 / 정지 (Space)">
          <svg class="tri" viewBox="0 0 16 16"><path d="M4 2.5v11a.6.6 0 0 0 .9.5l9-5.5a.6.6 0 0 0 0-1l-9-5.5a.6.6 0 0 0-.9.5z"/></svg>
          <svg class="pause" viewBox="0 0 16 16"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg>
        </button>
        <button class="step" id="fwd" data-i18n-aria="fwd" data-i18n-title="fwd" aria-label="현재 쪽으로" title="현재 쪽으로 (→)"><svg viewBox="0 0 16 16"><path d="M4 2.8v10.4a.6.6 0 0 0 .9.5l7.7-5.2a.6.6 0 0 0 0-1L4.9 2.3a.6.6 0 0 0-.9.5z"/></svg></button>
        <span class="divider" aria-hidden="true"></span>
        <div class="seg" id="speed" role="radiogroup" data-i18n-aria="speed" aria-label="재생 속도">
          <button role="radio" data-v="0.4" data-i18n="slow" aria-checked="false">느리게</button>
          <button role="radio" data-v="1" data-i18n="normal" aria-checked="true">보통</button>
          <button role="radio" data-v="3" data-i18n="fast" aria-checked="false">빠르게</button>
        </div>
      </div>
      <span class="spacer"></span>
      <div class="tchip" id="seaChip"><span class="tv" id="seaVal">—</span><span class="tl" data-i18n="sea">해수면</span></div>
      <div class="tchip" id="temp"><span class="tv" id="tempVal">—</span><span class="tl" data-i18n="temp">평균 기온</span></div>
      <div class="when"><span class="big" id="when">—</span><span class="ma" id="ka">—</span><button class="fold" id="fold" aria-expanded="false" aria-controls="evrow presets treeBtn" data-i18n-aria="more" data-i18n-title="more" aria-label="더 보기" title="더 보기"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg></button></div>
    </div>
    <div class="track" id="track">
      <div class="strata" id="strata"></div>
      <div class="tltip" id="tltip" hidden role="tooltip"><i></i><b></b><span></span></div>
      <input type="range" id="t" data-i18n-aria="slider" aria-label="시간 선택: 왼쪽이 과거, 오른쪽이 현재">
    </div>
    <div class="ticks" id="ticks"></div>
    <div class="evrow" id="evrow" data-i18n-aria="events" aria-label="사건"></div>
    <div class="chiprow"><button class="tree" id="treeBtn" aria-pressed="false" aria-controls="evrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v2c0 .6-.4 1-1 1H7c-.6 0-1-.4-1-1V9"/><path d="M12 12v3"/></svg><span></span></button><div class="pwrap" id="pwrap"><div class="presets" id="presets" data-i18n-aria="shortcuts" aria-label="주요 사건 바로 가기"></div></div></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://junhyeopsong.github.io/time-machine-ui/v1/ui.js"></script>
<script>
TMUI.fillIcons();
const $ = id => document.getElementById(id);
const D2R = Math.PI / 180;

    const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0); const d = x.getImageData(0, 0, im.width, im.height).data, o = new Uint8Array(im.width * im.height);
    for (let i = 0; i < o.length; i++) o[i] = d[i * 4]; res(o); }; im.onerror = () => rej(new Error(src)); im.src = src; });
}
Promise.all([loadRelief('data/relief.png'), fetch('data/sealevel.json').then(r => r.json()), fetch('data/events.json').then(r => r.json()),
  fetch('data/ice_nh.json').then(r => r.json()), loadGray('data/ice_nh.png'), fetch('data/sites.json').then(r => r.json()),
  fetch('data/species.json').then(r => r.json()), fetch('data/temperature.json').then(r => r.json()), loadGray('data/arrival.png')]).then(([r, sea, ev, im, ia, st, spc, tp, arv]) => {
  TEMP = tp.gmst; ARRIVAL = arv;
  buildSpecies(spc.species, st);
  EV = ev.events; KINDS = ev.kinds; buildPins(); buildEvRow(); buildChips();
  RW = r.w; RH = r.h; relief = r.e; shade = shadeGrid(relief, RW, RH); SEA = sea; buildIce();
  const rows = im.grid.rows, per = rows * RW;
  NH = { rows, slices: im.slices.map((s, i) => {
    let g = 0, k = 0; for (let a = Math.ceil(s.to); a <= Math.floor(s.from); a++) { g += glacial(seaAt(a)); k++; }   // how glacial the sea was during the slice
    return { ...s, glac: k ? g / k : glacial(seaAt((s.from + s.to) / 2)), depth: depthField(ia.subarray(i * per, (i + 1) * per), rows) }; }) };
  gridCv = document.createElement('canvas'); gridCv.width = RW; gridCv.height = RH;
  gridCtx = gridCv.getContext('2d'); gridImg = gridCtx.createImageData(RW, RH);
  $('loading').hidden = true;
  setAge(age); paint(seaAt(age));
}).catch(e => { $('loading').textContent = String(e); });
